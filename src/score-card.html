<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Solecito Score</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&family=Inter:wght@400;500;600&display=swap">
<style>
  :root {
    --bg: #FFF8F0;
    --surface: #FFFFFF;
    --fg: #2A1F14;
    --muted: #7A6A5A;
    --border: #EADBC8;
    --accent: #D4700A;
    --success: #1A7F4B;
    --success-bg: #E3F5EA;
    --miss: #B91C1C;
    --miss-bg: #FDE8E8;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17120D;
      --surface: #231C14;
      --fg: #F6EDE2;
      --muted: #B3A391;
      --border: #3A2F23;
      --accent: #F28C3A;
      --success: #34C97A;
      --success-bg: #12301F;
      --miss: #F87171;
      --miss-bg: #3A1717;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17120D;
    --surface: #231C14;
    --fg: #F6EDE2;
    --muted: #B3A391;
    --border: #3A2F23;
    --accent: #F28C3A;
    --success: #34C97A;
    --success-bg: #12301F;
    --miss: #F87171;
    --miss-bg: #3A1717;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, sans-serif;
  }
  [hidden] { display: none !important; }
  .theme-toggle {
    position: fixed; top: 12px; right: 12px;
    background: var(--surface); color: var(--fg);
    border: 1px solid var(--border); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #waiting { text-align: center; color: var(--muted); }
  #waiting .dot {
    width: 16px; height: 16px; margin: 0 auto 16px;
    border-radius: 50%; background: var(--accent);
    animation: pulse 1.4s ease-in-out infinite;
  }
  #waiting h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin: 0 0 6px; color: var(--fg); }
  #waiting p { margin: 0; font-size: 14px; }
  @keyframes pulse {
    0%, 100% { transform: scale(0.8); opacity: 0.5; }
    50% { transform: scale(1.3); opacity: 1; }
  }
  #card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 28px 24px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
  }
  .lang { font-size: 15px; font-weight: 600; color: var(--muted); }
  .lang .flag { font-size: 24px; margin-right: 6px; vertical-align: middle; }
  .score {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 800; font-size: 72px; line-height: 1.1;
    color: var(--accent); margin: 12px 0 4px;
  }
  .label { font-size: 13px; color: var(--muted); margin-bottom: 20px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 24px; }
  .chip {
    padding: 6px 12px; border-radius: 999px;
    font-size: 14px; font-weight: 500; border: 1px solid transparent;
  }
  .chip.ok { background: var(--success-bg); color: var(--success); border-color: var(--success); }
  .chip.miss { background: var(--miss-bg); color: var(--miss); border-color: var(--miss); }
  #share {
    background: var(--accent); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 22px; font: inherit; font-weight: 600; cursor: pointer;
  }
  #share:focus-visible, .theme-toggle:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<button class="theme-toggle" id="theme" type="button" aria-label="Toggle dark mode">Theme</button>

<div id="waiting">
  <div class="dot"></div>
  <h1>Waiting for game to end...</h1>
  <p>Your score card will appear here.</p>
</div>

<div id="card" hidden>
  <div class="lang"><span class="flag" id="flag"></span><span id="lang"></span></div>
  <div class="score" id="score"></div>
  <div class="label">words correct</div>
  <div class="chips" id="chips"></div>
  <button id="share" type="button">Share score</button>
</div>

<script>
  const FLAGS = { spanish: '🇪🇸', french: '🇫🇷', japanese: '🇯🇵', portuguese: '🇧🇷', german: '🇩🇪', italian: '🇮🇹' };
  let lastTimestamp = null;
  let lastSummary = '';

  function flagFor(language) {
    return FLAGS[String(language || '').trim().toLowerCase()] || '🌍';
  }

  function render(data) {
    const words = Array.isArray(data.words) ? data.words : [];
    document.getElementById('flag').textContent = flagFor(data.language);
    document.getElementById('lang').textContent = data.language || 'Language';
    document.getElementById('score').textContent = data.score + ' / ' + data.total;

    const chips = document.getElementById('chips');
    chips.replaceChildren();
    for (const w of words) {
      const chip = document.createElement('span');
      chip.className = 'chip ' + (w.correct ? 'ok' : 'miss');
      chip.textContent = (w.translation != null && w.translation !== '') ? w.translation : w.english;
      chips.appendChild(chip);
    }

    lastSummary = 'Mi Solecito ' + flagFor(data.language) + ' ' + (data.language || '') +
      ': I got ' + data.score + ' / ' + data.total + '\n' +
      words.map(w => (w.correct ? '✅ ' : '❌ ') + ((w.translation != null && w.translation !== '') ? w.translation : w.english)).join('\n');

    document.getElementById('waiting').hidden = true;
    document.getElementById('card').hidden = false;
  }

  async function poll() {
    try {
      const res = await fetch('/score');
      const data = await res.json();
      if (!data.waiting && data.timestamp !== lastTimestamp) {
        lastTimestamp = data.timestamp;
        render(data);
      }
    } catch (e) { /* server unreachable; keep polling */ }
  }

  document.getElementById('share').addEventListener('click', async (e) => {
    const btn = e.currentTarget;
    try {
      await navigator.clipboard.writeText(lastSummary);
      btn.textContent = 'Copied!';
    } catch (err) {
      btn.textContent = 'Copy failed';
    }
    setTimeout(() => { btn.textContent = 'Share score'; }, 1500);
  });

  document.getElementById('theme').addEventListener('click', () => {
    const root = document.documentElement;
    const dark = root.dataset.theme
      ? root.dataset.theme === 'dark'
      : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
  });

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
